name: lean-speedtest
on:
  push:
    branches: [speedtest-actions]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan + Lean v4.36.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.36.0
          elan default leanprover/lean4:v4.36.0
          lake --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-v1-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - name: Mathlib cache get
        run: lake exe cache get
      - name: Build libraries (PvsNP + CookLevin)
        run: lake build PvsNP CookLevin
      - name: Check (a) full import Mathlib
        run: |
          start=$(date +%s)
          lake env lean PvsNP/Units/m3_clause_pad_split.lean
          echo "A_FULL_WALL_SECONDS=$(( $(date +%s) - start ))"
      - name: Check (b) no Mathlib root import
        run: |
          start=$(date +%s)
          lake env lean Speedtest/b_noroot.lean
          echo "B_NOROOT_WALL_SECONDS=$(( $(date +%s) - start ))"
      - name: Check regression-6 products (full imports)
        run: |
          for f in Regression6/m3_empty_clause_unsat.lean Regression6/m3_positive_clause_sat.lean Regression6/m3_negative_clause_sat.lean Regression6/m3_tautology_clause.lean Regression6/m3_pure_literal.lean Regression6/m3_equiv_literal_subst.lean; do
            start=$(date +%s)
            lake env lean "$f"
            echo "REG6_PASS $f WALL_SECONDS=$(( $(date +%s) - start ))"
          done
          echo "REG6_ALL_DONE"
