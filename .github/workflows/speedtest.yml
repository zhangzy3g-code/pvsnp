name: lean-speedtest
on:
  push:
    branches: [speedtest-actions]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan + Lean v4.36.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.36.0
          elan default leanprover/lean4:v4.36.0
          lake --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-v1-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - name: Mathlib cache get
        run: lake exe cache get
      - name: Build libraries (PvsNP + CookLevin)
        run: lake build PvsNP CookLevin
      - name: Check pipeline candidates (full imports)
        run: |
          for f in PipelineVerify/*.lean; do
            start=$(date +%s)
            if lake env lean "$f" > "pv-$(basename "$f" .lean).log" 2>&1; then
              echo "PIPE_PASS $f WALL_SECONDS=$(( $(date +%s) - start ))"
            else
              echo "PIPE_FAIL $f WALL_SECONDS=$(( $(date +%s) - start ))"
              tail -20 "pv-$(basename "$f" .lean).log" || true
            fi
          done
          echo "PIPE_ALL_DONE"
